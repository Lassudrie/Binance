[paths]
raw_dir = "data/raw"
bronze_dir = "data/bronze"
silver_dir = "data/silver"
gold_dir = "data/gold"
metadata_dir = "data/metadata"
reports_dir = "data/reports"

[binance]
market = "spot"
frequency = "daily"
verify_checksum = true
timeout_seconds = 30

[dataset]
dataset_type = "trades"
symbols = ["BTCUSDT"]
start_date = "2025-01-01"
end_date = "2025-01-10"

[features]
bar_size = "1s"
rolling_window_bars = 60
volatility_window_bars = 120
range_window_bars = 60
normalization_window_bars = 240

[strategy]
name = "cumulative_delta_breakout"
position_size = 0.005

[strategy.params]
cumulative_delta_threshold = 1.2
breakout_lookback_bars = 30
exit_zscore_threshold = 0.3

[execution]
default_order_type = "market"
maker_fee_bps = 1.0
taker_fee_bps = 5.0
slippage_bps = 3.0
fallback_half_spread_bps = 1.5
impact_bps_per_unit_participation = 20.0
latency_bars = 1
market_participation_cap = 0.20
limit_participation_cap = 0.08
limit_offset_bps = 1.5
max_order_lifetime_bars = 3
allow_limit_orders = true

[portfolio]
initial_cash = 100000.0
allow_short = true

[risk]
max_holding_bars = 600
stop_loss_bps = 25.0
take_profit_bps = 40.0
trailing_stop_bps = 20.0
cooldown_bars_after_stop = 15

[validation]
train_bars = 3600
test_bars = 1200
step_bars = 1200
embargo_bars = 2

[reporting]
run_name = "btcusdt_1s_backtest"
