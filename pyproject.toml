[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-orderflow-research"
version = "0.1.0"
description = "Production-oriented order flow research and backtesting framework for Binance historical data."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Codex" }
]
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "polars>=1.14.0",
  "pyarrow>=17.0.0",
  "pydantic>=2.11.0",
  "httpx>=0.28.0",
  "websockets>=14.0.0",
  "duckdb>=1.3.0",
  "pyyaml>=6.0.2",
  "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
qflow = "quantflow.cli.main:main"
ofbot = "ofbot.cli:main"

[tool.setuptools]
packages = [
  "ofbot",
  "ofbot.cli",
  "ofbot.gateway",
  "ofbot.market",
  "ofbot.strategy",
  "ofbot.execution",
  "ofbot.memory",
  "ofbot.replay",
  "ofbot.utils",
  "quantflow.cli",
  "quantflow.core",
  "quantflow.data_ingestion",
  "quantflow.data_model",
  "quantflow.feature_engineering",
  "quantflow.strategy",
  "quantflow.execution",
  "quantflow.backtest",
  "quantflow.validation",
  "quantflow.reporting",
  "quantflow.utils",
]

[tool.setuptools.package-dir]
"ofbot" = "src/ofbot"
"ofbot.cli" = "src/ofbot/cli"
"ofbot.gateway" = "src/ofbot/gateway"
"ofbot.market" = "src/ofbot/market"
"ofbot.strategy" = "src/ofbot/strategy"
"ofbot.execution" = "src/ofbot/execution"
"ofbot.memory" = "src/ofbot/memory"
"ofbot.replay" = "src/ofbot/replay"
"ofbot.utils" = "src/ofbot/utils"
"quantflow.cli" = "apps/cli/src/quantflow/cli"
"quantflow.core" = "packages/core/src/quantflow/core"
"quantflow.data_ingestion" = "packages/data_ingestion/src/quantflow/data_ingestion"
"quantflow.data_model" = "packages/data_model/src/quantflow/data_model"
"quantflow.feature_engineering" = "packages/feature_engineering/src/quantflow/feature_engineering"
"quantflow.strategy" = "packages/strategy/src/quantflow/strategy"
"quantflow.execution" = "packages/execution/src/quantflow/execution"
"quantflow.backtest" = "packages/backtest/src/quantflow/backtest"
"quantflow.validation" = "packages/validation/src/quantflow/validation"
"quantflow.reporting" = "packages/reporting/src/quantflow/reporting"
"quantflow.utils" = "packages/utils/src/quantflow/utils"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.setuptools.package-data]
ofbot = ["*.txt", "*.yaml", "*.yml"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
  "apps/cli/src",
  "packages/core/src",
  "packages/data_ingestion/src",
  "packages/data_model/src",
  "packages/feature_engineering/src",
  "src",
  "packages/strategy/src",
  "packages/execution/src",
  "packages/backtest/src",
  "packages/validation/src",
  "packages/reporting/src",
  "packages/utils/src",
]
